<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Change List plugin — preview</title>
    <style>
      /* Approximates Ship Studio's dark chrome so the plugin looks in-place. */
      :root {
        --bg-primary: #16181d;
        --bg-secondary: #1c1f26;
        --bg-tertiary: #252932;
        --text-primary: #e6e8ec;
        --text-secondary: #a8adb8;
        --text-muted: #6f7681;
        --border: #2c313b;
        --accent: #7aa2f7;
        --action: #3b6fd4;
        --success: #3fbf6f;
        --warning: #f59e0b;
        --error: #f04a4a;
        --radius: 6px;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-primary);
        color: var(--text-primary);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .chrome {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-secondary);
      }
      .chrome span { color: var(--text-muted); font-size: 12px; }
      .toolbar-icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        border-radius: var(--radius);
        padding: 5px 8px;
        cursor: pointer;
      }
      .toolbar-icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
      /* Preview-only chrome controls, not part of the plugin. */
      .chrome-btn {
        background: transparent;
        border: 1px dashed var(--border);
        color: var(--text-muted);
        border-radius: var(--radius);
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
      }
      code { font-family: var(--font-mono); }

      /* --- mock Ship Studio shell (preview only) --- */
      #app-root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .subbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-secondary);
        color: var(--text-muted);
        font-size: 12px;
        flex: none;
      }
      /* Fills the space under the two bars — this is what should get narrower. */
      .content-row {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .preview-pane {
        flex: 1;
        background: #fdf6ec;
        color: #3b2a20;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      .preview-inner { font-size: 13px; opacity: 0.65; }
    </style>
  </head>
  <body>
    <!--
      A stand-in for Ship Studio's workspace shell, shaped like the real one so
      the pinned dock's reflow can be tested offline:

        #app-root
          .chrome        full-width header  (plugin slots live here)
          .subbar        full-width Edit/Inspect bar
          .content-row   fills the rest; holds the preview

      Without this the harness has nothing to reflow, and the only way to test
      pinning would be to ship it and ask Keyan.
    -->
    <div id="app-root">
      <div class="chrome">
        <span>Ship Studio (preview)</span>
        <div id="root"></div>
      </div>
      <div class="subbar"><span>Edit</span><span>Inspect</span><span>542 × 768</span></div>
      <div class="content-row">
        <div class="preview-pane" id="preview-pane">
          <div class="preview-inner">preview pane</div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
